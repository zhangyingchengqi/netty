# .github/workflows/claude-review.yml
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# 针对同一PR的新提交自动取消正在运行的旧任务，以节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # 仅在触发PR相关事件或评论中包含“@claude”时运行
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，以便进行差异分析

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.minimax.cn/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: MiniMax-M3.1-Flash[1m]  # 以你本地实际模型名为准
          ANTHROPIC_DEFAULT_SONNET_MODEL: MiniMax-M3.1-Flash[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: MiniMax-M3.1-Flash[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: MiniMax-M3.1-Flash[1m]
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
        with:
          anthropic_api_key: dummy-not-used  # Action 要求非空，实际认证走 AUTH_TOKEN
          prompt: |
            请审查此PR的代码变更，重点检查以下内容。
            1. 安全漏洞（如SQL注入、XSS攻击、敏感信息硬编码等）。
            2. 未处理的异常情况及边界条件。
            3. 性能隐患（如N+1查询、内存泄漏风险）。
            请按以下格式输出报告。
            ## 审查报告
            ### Critical（必须修复）
            ### Warning（建议修复）
            ### Suggestion（可选优化）
          claude_args: >-
            --allowedTools "Read,Grep,Glob"
            --max-turns 10